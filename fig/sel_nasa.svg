<text x="40" y="786">Terrain already vetted for a crewed landing: slope, light and ice distance. The 2024 revision kept the</text><text x="40" y="804">de Gerlache–Nobile arc, added sites farther out, and dropped the narrow crest regions nearest the pole.</text><line x1="640" y1="740" x2="782.0" y2="740" stroke="#A0A7B3" stroke-width="2"/><line x1="640" y1="736" x2="640" y2="744" stroke="#A0A7B3" stroke-width="2"/><line x1="782.0" y1="736" x2="782.0" y2="744" stroke="#A0A7B3" stroke-width="2"/><text class="s" x="640" y="730">100 km</text>
