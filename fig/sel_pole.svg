<text class="b" x="560" y="120">blue floors: permanently shadowed,</text><text class="b" x="560" y="136">below 110 K — water ice</text><text x="40" y="786">The Sun never climbs more than ~1.5° above the horizon: high rims stay lit most of the year,</text><text x="40" y="804">deep floors never see it. Power lives on the rims; ice lives next door in the floors.</text><line x1="700" y1="740" x2="802.5" y2="740" stroke="#A0A7B3" stroke-width="2"/><line x1="700" y1="736" x2="700" y2="744" stroke="#A0A7B3" stroke-width="2"/><line x1="802.5" y1="736" x2="802.5" y2="744" stroke="#A0A7B3" stroke-width="2"/><text class="s" x="700" y="730">50 km</text>
